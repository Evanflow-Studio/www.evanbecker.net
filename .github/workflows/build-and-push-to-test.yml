name: Build & Deploy Test

on:
  push:
    branches: [ "develop" ]

# Our own runner only (Evan, 2026-10-29), pushing to GHCR. The images hold no secrets.
# LXC 109 pulls from GHCR once its .env sets REGISTRY=ghcr.io/evanflow-studio
# (evanflow-infra docs/briefs/ebn-keyvault-migration.md, Part 1 step 2).
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/evanflow-studio

jobs:
  build_and_push:
    runs-on: [self-hosted, linux, homelab]
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate version
        id: version
        run: echo "version=$(date +%Y.%m.%d)-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build images
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/evanbecker-api:test \
            -t ${{ env.REGISTRY }}/evanbecker-api:test-${{ github.sha }} \
            -f evanbecker-api/Dockerfile .
          docker build \
            --build-arg NUXT_PUBLIC_SITE_URL=https://test.evanbecker.net \
            --build-arg NUXT_PUBLIC_API_URL=https://api-test.evanbecker.net \
            --build-arg NUXT_PUBLIC_AUTH0_DOMAIN=dev-m3uiopcp.us.auth0.com \
            --build-arg NUXT_PUBLIC_AUTH0_CLIENT_ID=2evqEjBNUmBVt6fNwcGkicfjNNrYsjV0 \
            --build-arg NUXT_PUBLIC_AUTH0_AUDIENCE=evanbecker.api \
            --build-arg NUXT_PUBLIC_AUTH0_REDIRECT_URI=https://test.evanbecker.net \
            --build-arg NUXT_PUBLIC_RECAPTCHA_SITE_KEY=6Lfb5pksAAAAAHnzNOV1DxBqF_EYU9UPVimOR6WZ \
            --build-arg NUXT_PUBLIC_APP_VERSION=${{ steps.version.outputs.version }} \
            -t ${{ env.REGISTRY }}/evanbecker-client:test \
            -t ${{ env.REGISTRY }}/evanbecker-client:test-${{ github.sha }} \
            evanbecker-client

      - name: Push to GHCR
        run: |
          docker push ${{ env.REGISTRY }}/evanbecker-api:test
          docker push ${{ env.REGISTRY }}/evanbecker-api:test-${{ github.sha }}
          docker push ${{ env.REGISTRY }}/evanbecker-client:test
          docker push ${{ env.REGISTRY }}/evanbecker-client:test-${{ github.sha }}

      # Self-hosted runners keep state between jobs: drop the registry login and
      # old layers so neither the token nor the disk outlives the job.
      - name: Log out and clean up
        if: always()
        run: |
          docker logout ghcr.io || true
          docker image prune -f
