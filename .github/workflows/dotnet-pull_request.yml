name: Build and Test

on:
  pull_request:
    branches: [ "main" ]

# PRs from forks run untrusted code; keep them off the self-hosted runner.
permissions:
  contents: read

jobs:
  build-and-test-api:
    runs-on: ubuntu-latest
    env:
      working-directory: ./evanbecker-api
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
      working-directory: ${{env.working-directory}}
    - name: Build
      run: dotnet build --no-restore
      working-directory: ${{env.working-directory}}
    - name: Test
      run: dotnet test --no-build --verbosity normal
      working-directory: ${{env.working-directory}}

  build-and-test-client:
    runs-on: ubuntu-latest
    env:
      working-directory: ./evanbecker-client
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install dependencies
      run: npm install
      working-directory: ${{env.working-directory}}
    - name: Unit tests
      run: npm run test:unit
      working-directory: ${{env.working-directory}}
    - name: Build
      run: npm run build
      working-directory: ${{env.working-directory}}

  gitleaks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Scan this PR's commits for secrets
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # The official image, pinned; run as the checkout's owner so git trusts the repo.
      run: |
        docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1           git /repo --redact --verbose --log-opts="$BASE_SHA..$HEAD_SHA"
